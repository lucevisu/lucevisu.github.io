---
layout: default
---

<div class="container post-detail">
  <article>
    <!-- Post Header -->
    <header class="post-header">
      <div style="margin-bottom: 1rem;">
        <a href="{{ '/blog.html' | relative_url }}" class="btn btn-outline btn-sm">
          ← Quay lại danh sách Blog
        </a>
      </div>
      
      <div class="badge-pill">
        <span>Bài viết</span>
      </div>

      <h1>{{ page.title }}</h1>
      
      <div class="blog-meta">
        <span class="blog-date">📅 {{ page.date | date: "%d/%m/%Y" }}</span>
        <span>•</span>
        <span>✍️ Tác giả: {{ site.author.name }}</span>
        {% if page.category %}
        <span>•</span>
        <span>📁 {{ page.category }}</span>
        {% endif %}
      </div>
    </header>

    <!-- Post Body Content -->
    <div class="post-content">
      {{ content }}
    </div>

    <!-- Post Footer -->
    <div style="margin-top: 3.5rem; padding-top: 2rem; border-top: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; flex-wrap: gap;">
      <a href="{{ '/blog.html' | relative_url }}" class="btn btn-primary">
        ← Khám phá thêm bài viết
      </a>
      <a href="{{ '/contact.html' | relative_url }}" class="btn btn-outline">
        Liên hệ tác giả
      </a>
    </div>
  </article>
</div>
